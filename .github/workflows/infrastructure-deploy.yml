name: Infrastructure Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'terraform/**'
      - '.github/workflows/infrastructure-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./terraform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: production
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            <details><summary>Show Plan</summary>
            \`\`\`terraform\n${{ steps.plan.outputs.stdout }}\n\`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: production
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}

      - name: Export Terraform Outputs
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          CF_DOMAIN=$(terraform output -raw cloudfront_domain_name)
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          ASG=$(terraform output -raw asg_name)
          TG_ARN=$(terraform output -raw target_group_arn)

          echo "alb_dns_name=$ALB_DNS"               >> $GITHUB_OUTPUT
          echo "cloudfront_domain=$CF_DOMAIN"        >> $GITHUB_OUTPUT
          echo "cloudfront_id=$CF_ID"                >> $GITHUB_OUTPUT
          echo "s3_bucket=$S3_BUCKET"                >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL"                    >> $GITHUB_OUTPUT
          echo "asg_name=$ASG"                       >> $GITHUB_OUTPUT
          echo "target_group_arn=$TG_ARN"            >> $GITHUB_OUTPUT
          
          # Create JSON output file for artifact upload
          terraform output -json > terraform-outputs.json

      - name: Push Outputs as App-Repo Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_REPO: ${{ vars.APP_REPO }}
        run: |
          gh secret set ALB_DNS_NAME           --body "${{ steps.tf-outputs.outputs.alb_dns_name }}"    --repo "$APP_REPO"
          gh secret set CLOUDFRONT_DOMAIN      --body "${{ steps.tf-outputs.outputs.cloudfront_domain }}" --repo "$APP_REPO"
          gh secret set CLOUDFRONT_DISTRIBUTION_ID --body "${{ steps.tf-outputs.outputs.cloudfront_id }}"  --repo "$APP_REPO"
          gh secret set FRONTEND_S3_BUCKET     --body "${{ steps.tf-outputs.outputs.s3_bucket }}"       --repo "$APP_REPO"
          gh secret set ECR_REPOSITORY         --body "${{ steps.tf-outputs.outputs.ecr_url }}"         --repo "$APP_REPO"
          gh secret set ASG_NAME               --body "${{ steps.tf-outputs.outputs.asg_name }}"        --repo "$APP_REPO"
          gh secret set TARGET_GROUP_ARN       --body "${{ steps.tf-outputs.outputs.target_group_arn }}" --repo "$APP_REPO"

      - name: Upload Outputs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: ${{ env.TF_WORKING_DIR }}/terraform-outputs.json